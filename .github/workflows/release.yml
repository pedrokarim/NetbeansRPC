name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if [[ -z "${version}" || "${tag}" == "${version}" ]]; then
            echo "Expected a tag starting with v, got: ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set Maven project version
        run: >
          mvn -B
          org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion=${{ steps.version.outputs.version }}
          -DgenerateBackupPoms=false

      - name: Build NBM package
        run: mvn -B -DskipTests clean package

      - name: Generate SHA-256 checksums
        shell: bash
        run: sha256sum target/nbm/*.nbm > target/nbm/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetbeansRPC-${{ steps.version.outputs.version }}
          path: |
            target/nbm/*.nbm
            target/nbm/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NetbeansRPC ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/nbm/*.nbm
            target/nbm/SHA256SUMS.txt
